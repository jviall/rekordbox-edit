name: CI Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  code-change:
    name: Skip Checks?
    runs-on: ubuntu-slim
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      paths_result: ${{ steps.skip_check.outputs.paths_result }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@4c5980e005e0ae8f7d9dff27ae88c605fe4c5ecc # master
        with:
          cancel_others: true
          concurrent_skipping: same_content_newer
          paths_filter: |
            code:
              paths:
                - 'rekordbox_edit/**'
                - 'tests/**'
                - 'pyproject.toml'
                - 'uv.lock'
                - 'Makefile'
                - 'ruff.toml'
              paths_ignore:
                - '**/*.md'
            docs:
              paths:
                - 'docs/**'
                - 'mkdocs.yml'
                - '.readthedocs.yaml'
                # The docsite renders docstrings and CLI help from the package.
                - 'rekordbox_edit/**'
                - 'pyproject.toml'
                - 'uv.lock'

  commit-check:
    name: 📝 Commits
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    env:
      PYTHON: "3.14"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate commits and PR title
        uses: ./.github/actions/commit-check

  lint:
    name: 🧺 Lint
    runs-on: ubuntu-latest
    needs: code-change
    if: ${{ needs.code-change.outputs.should_skip != 'true' && !fromJSON(needs.code-change.outputs.paths_result || '{}').code.should_skip }}
    env:
      PYTHON: "3.14"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run lint tests
        uses: ./.github/actions/lint

  unit-tests:
    name: 🧪 Tests
    needs: code-change
    if: ${{ needs.code-change.outputs.should_skip != 'true' && !fromJSON(needs.code-change.outputs.paths_result || '{}').code.should_skip }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.11", "3.14"] # oldest and latest
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run unit tests
        uses: ./.github/actions/test

  e2e-tests:
    name: 🎚️ E2E
    needs: code-change
    if: ${{ needs.code-change.outputs.should_skip != 'true' && !fromJSON(needs.code-change.outputs.paths_result || '{}').code.should_skip }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "windows-latest"]
        python-version: ["3.11", "3.14"]
        rb-version: ["6.8.6"]
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      RBE_DB_VERSION: ${{ matrix.rb-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run e2e tests
        uses: ./.github/actions/e2e

  docs-build:
    name: 📚 Docs
    runs-on: ubuntu-latest
    needs: code-change
    if: ${{ needs.code-change.outputs.should_skip != 'true' && !fromJSON(needs.code-change.outputs.paths_result || '{}').docs.should_skip }}
    env:
      PYTHON: "3.14"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup UV
        uses: ./.github/actions/install

      # Mirrors the Read the Docs invocation so breaks surface on the PR.
      - name: Build docs (strict)
        run: make docs-build

  all-green:
    name: ✅ All Green
    if: always()
    needs:
      - commit-check
      - lint
      - unit-tests
      - e2e-tests
      - docs-build
    runs-on: Ubuntu-latest

    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: commit-check, unit-tests, lint, e2e-tests, docs-build
          jobs: ${{ toJSON(needs) }}
